name: Generate catalog

# WHAT: Regenerates model_adapters.json from models.dev and overrides.json and commits it when it changed.
# HOW:  Daily, on manual dispatch, and on push to main. Tests, generation, and validation must pass
#       before anything is committed; an unchanged catalog produces no commit.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: generate-catalog
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run generator tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Generate catalog
        run: python3 scripts/generate.py

      - name: Validate catalog
        run: python3 scripts/validate.py model_adapters.json

      - name: Commit catalog when changed
        run: |
          if [ -z "$(git status --porcelain -- model_adapters.json)" ]; then
            echo "Catalog unchanged"
            exit 0
          fi
          revision=$(python3 -c 'import json; print(json.load(open("model_adapters.json"))["revision"])')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model_adapters.json
          git commit -m "Update catalog from models.dev (revision ${revision})"
          git push
